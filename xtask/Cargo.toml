[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flatbuffers-reflection = "=0.1.0"
minijinja = { version = "=2.19.0", default-features = false, features = ["builtins", "json", "multi_template", "serde", "std_collections"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = { version = "=0.10.9", default-features = false }
toml = "=0.9.9"

[lints.clippy]
# Generated text belongs in MiniJinja templates, never in Rust string builders.
format_push_string = "deny"
string_add = "deny"
string_add_assign = "deny"
