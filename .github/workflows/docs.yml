name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Schema Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v12
      - name: Resolve docs version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            docs_version="${version%.*}"
          elif [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            docs_version="${GITHUB_REF_NAME}"
          else
            docs_version="manual"
          fi
          echo "DOCS_VERSION=${docs_version}" >> "${GITHUB_ENV}"
      - name: Prepare gh-pages worktree
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pages_dir="${RUNNER_TEMP}/synapse_fbs_pages"
          rm -rf "${pages_dir}"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add "${pages_dir}" gh-pages
          else
            git worktree add --detach "${pages_dir}"
            git -C "${pages_dir}" switch --orphan gh-pages
            git -C "${pages_dir}" rm -rf . || true
          fi

          echo "PAGES_DIR=${pages_dir}" >> "${GITHUB_ENV}"
      - name: Generate docs
        run: nix develop --command cargo run --locked --manifest-path xtask/Cargo.toml -- docs --version "${DOCS_VERSION}" --out-dir "${PAGES_DIR}"
      - name: Publish docs
        shell: bash
        run: |
          set -euxo pipefail
          cd "${PAGES_DIR}"
          git add -A
          if git diff --cached --quiet; then
            echo "No docs changes to publish."
          else
            git commit -m "Update schema docs for ${DOCS_VERSION}"
            git push origin HEAD:gh-pages
          fi
