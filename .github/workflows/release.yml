name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and verify
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- ci --release-name "${GITHUB_REF_NAME}"
      - name: Upload GitHub Release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          files=(
            target/xtask/packages/python/dist/*.whl
            target/xtask/packages/python/dist/*.tar.gz
            target/xtask/packages/rust/target/package/*.crate
            target/xtask/artifacts/*.tar.gz
            target/xtask/artifacts/*.sha256
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}"
          fi
      - name: Publish Rust crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path target/xtask/packages/rust/Cargo.toml --allow-dirty --token "${CARGO_REGISTRY_TOKEN}"
      - name: Publish Python package to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload target/xtask/packages/python/dist/*
