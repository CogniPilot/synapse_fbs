name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build
          python -m pip install --disable-pip-version-check build==1.5.0 twine==7.0.0
      - name: Build and verify
        run: make packages RELEASE_NAME="${GITHUB_REF_NAME}"
      - name: Pack npm package
        run: npm pack
        working-directory: target/xtask/packages/js
      - name: Upload GitHub Release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            target/xtask/packages/python/dist/*.whl
            target/xtask/packages/python/dist/*.tar.gz
            target/xtask/packages/rust/target/package/*.crate
            target/xtask/packages/js/*.tgz
            target/xtask/artifacts/*.tar.gz
            target/xtask/artifacts/*.sha256
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" --title "${GITHUB_REF_NAME}" --notes "Release ${GITHUB_REF_NAME}"
          fi
      - name: Check published package versions
        id: published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          rust=false
          python=false
          javascript=false
          user_agent="CogniPilot/synapse_fbs release workflow"

          if curl --fail --silent --show-error --user-agent "${user_agent}" "https://crates.io/api/v1/crates/synapse_fbs/${version}" >/dev/null; then
            rust=true
          fi
          if curl --fail --silent --show-error --user-agent "${user_agent}" "https://pypi.org/pypi/synapse-fbs/${version}/json" >/dev/null; then
            python=true
          fi
          if npm view "@cognipilot/synapse-fbs@${version}" version >/dev/null 2>&1; then
            javascript=true
          fi

          {
            echo "version=${version}"
            echo "rust=${rust}"
            echo "python=${python}"
            echo "javascript=${javascript}"
          } >> "${GITHUB_OUTPUT}"

          echo "version=${version}"
          echo "rust=${rust}"
          echo "python=${python}"
          echo "javascript=${javascript}"
      - name: Authenticate with crates.io
        if: steps.published.outputs.rust != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish Rust crate to crates.io
        if: steps.published.outputs.rust != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --manifest-path target/xtask/packages/rust/Cargo.toml --allow-dirty
      - name: Publish Python package to PyPI
        if: steps.published.outputs.python != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: target/xtask/packages/python/dist/
      - name: Publish JavaScript package to npm
        if: steps.published.outputs.javascript != 'true'
        run: npm publish --access public
        working-directory: target/xtask/packages/js
