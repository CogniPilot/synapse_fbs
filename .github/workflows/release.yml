name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v12
      - name: Build and verify
        run: nix develop --command cargo run --locked --manifest-path xtask/Cargo.toml -- ci --release-name "${GITHUB_REF_NAME}"
      - name: Pack npm package
        run: nix develop --command npm pack
        working-directory: target/xtask/packages/js
      - name: Upload GitHub Release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            files=(
              target/xtask/packages/python/dist/*.whl
              target/xtask/packages/python/dist/*.tar.gz
              target/xtask/packages/rust/target/package/*.crate
              target/xtask/packages/js/*.tgz
              target/xtask/artifacts/*.tar.gz
              target/xtask/artifacts/*.sha256
            )
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
            else
              gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
                --title "${GITHUB_REF_NAME}" \
                --notes "Release ${GITHUB_REF_NAME}"
            fi
          '
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish Rust crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: nix develop --command cargo publish --manifest-path target/xtask/packages/rust/Cargo.toml --allow-dirty
      - name: Publish Python package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: target/xtask/packages/python/dist/
      - name: Publish JavaScript package to npm
        run: nix develop --command npm publish --access public
        working-directory: target/xtask/packages/js
