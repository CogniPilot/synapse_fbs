name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  FLATBUFFERS_COMMIT: 7e163021e59cca4f8e1e35a7c828b5c6b7915953
  FLATCC_COMMIT: d17e324e7e595272da486c5b9b20e848b78ba9ba

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release version
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "Release tag must be a stable semantic version such as v1.2.3" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "${GITHUB_ENV}"
      - name: Build native schema compilers
        run: |
          set -euo pipefail
          mkdir -p target/native-tools

          git init target/native-tools/flatbuffers
          git -C target/native-tools/flatbuffers remote add origin https://github.com/google/flatbuffers.git
          git -C target/native-tools/flatbuffers fetch --depth 1 origin "${FLATBUFFERS_COMMIT}"
          git -C target/native-tools/flatbuffers checkout --detach FETCH_HEAD
          cmake \
            -S target/native-tools/flatbuffers \
            -B target/native-tools/flatbuffers-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DFLATBUFFERS_BUILD_FLATLIB=OFF \
            -DFLATBUFFERS_INSTALL=OFF
          cmake \
            --build target/native-tools/flatbuffers-build \
            --config Release \
            --target flatc \
            --parallel

          git init target/native-tools/flatcc
          git -C target/native-tools/flatcc remote add origin https://github.com/dvidelabs/flatcc.git
          git -C target/native-tools/flatcc fetch --depth 1 origin "${FLATCC_COMMIT}"
          git -C target/native-tools/flatcc checkout --detach FETCH_HEAD
          cmake \
            -S target/native-tools/flatcc \
            -B target/native-tools/flatcc-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLATCC_TEST=OFF \
            -DFLATCC_INSTALL=OFF
          cmake \
            --build target/native-tools/flatcc-build \
            --config Release \
            --target flatcc_cli \
            --parallel

          {
            echo "SYNAPSE_FBS_FLATC=${PWD}/target/native-tools/flatbuffers-build/flatc"
            echo "SYNAPSE_FBS_FLATCC=${PWD}/target/native-tools/flatcc/bin/flatcc"
            echo "SYNAPSE_FBS_FLATCC_SOURCE=${PWD}/target/native-tools/flatcc"
          } >> "${GITHUB_ENV}"
      - name: Build and verify
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- ci --release-name "${GITHUB_REF_NAME}"
      - name: Upload GitHub Release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            target/xtask/packages/rust/target/package/*.crate
            target/xtask/artifacts/*.tar.gz
            target/xtask/artifacts/*.sha256
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}"
          fi
      - name: Check whether Rust crate is published
        id: published
        run: |
          set -euo pipefail
          rust=false
          user_agent="CogniPilot/synapse_fbs release workflow"

          if curl --fail --silent --show-error --user-agent "${user_agent}" "https://crates.io/api/v1/crates/synapse_fbs/${RELEASE_VERSION}" >/dev/null; then
            rust=true
          fi

          echo "rust=${rust}" >> "${GITHUB_OUTPUT}"
          echo "rust=${rust}"
      - name: Authenticate with crates.io
        if: steps.published.outputs.rust != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish Rust crate to crates.io
        if: steps.published.outputs.rust != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --manifest-path target/xtask/packages/rust/Cargo.toml --allow-dirty
