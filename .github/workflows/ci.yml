name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build python3-build python3-pip python3-venv twine
      - name: Test and build packages
        run: make ci
