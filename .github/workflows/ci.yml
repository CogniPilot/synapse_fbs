name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check formatting
        run: cargo fmt --check --manifest-path xtask/Cargo.toml
      - name: Lint
        run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
      - name: Schema checks
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- check
      - name: Install mdBook
        run: cargo install mdbook --version "$(awk -F= '/^MDBOOK_VERSION=/{print $2}' tools.lock)" --locked
      - name: Install Python build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and verify
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- ci
