name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: Check formatting
        run: nix develop --command cargo fmt --check --manifest-path xtask/Cargo.toml
      - name: Lint
        run: nix develop --command cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
      - name: Schema checks
        run: nix develop --command cargo run --locked --manifest-path xtask/Cargo.toml -- check
      - name: Build and verify
        run: nix develop --command cargo run --locked --manifest-path xtask/Cargo.toml -- ci
